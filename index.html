<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header class="max-w-2xl mx-auto px-6 pt-12 pb-8 text-center">
      <h1 class="text-[32px] font-bold">Task Manager</h1>
      <p class="mt-3 text-sm md:text-base text-[var(--muted-color)]">
        Приложение для создания и управления списком задач
      </p>
      <p
        class="inline-flex mt-5 items-center gap-2 rounded-full border border-[var(--border-color)] bg-[var(--card-color)] px-4 py-2 text-sm text-[var(--text-color)]"
      >
        Всего задач: <span id="header-total">0</span>
      </p>
    </header>

    <main class="max-w-2xl mx-auto px-4 pb-12">
      <section
        class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-5 md:p-6 mb-5 shadow-lg"
      >
        <h2 class="text-lg font-semibold text-[var(--text-color)] mb-5">
          Новая задача
        </h2>
        <form id="task-form" class="flex flex-col gap-3">
          <label
            for="task-input"
            class="text-sm font-medium text-[var(--muted-color)]"
          >
            Название задачи
          </label>

          <div class="flex flex-col sm:flex-row gap-3">
            <input
              id="task-input"
              type="text"
              placeholder="Что нужно сделать?"
              class="w-full min-w-0 flex-1 rounded-xl border border-[var(--border-color)] bg-[#141114] px-4 py-3 text-[var(--text-color)] placeholder:text-[#777078] outline-none transition focus:border-[var(--accent-color)] focus:ring-2 focus:ring-[var(--accent-color)]/20"
            />

            <button
              type="submit"
              class="rounded-xl bg-[var(--primary-color)] px-6 py-3 font-semibold text-white transition duration-200 hover:bg-[var(--accent-color)] active:scale-95"
            >
              Добавить
            </button>
          </div>

          <p id="form-error" class="text-sm text-[#d76a78]" hidden></p>
        </form>
      </section>

      <section
        class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-5 md:p-6 mb-5 shadow-lg"
      >
        <h2 class="text-lg font-semibold text-[var(--text-color)] mb-5">
          Статистика
        </h2>
        <ul class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <li
            class="rounded-xl border border-[var(--border-color)] bg-[#151215] p-4 text-sm text-[var(--muted-color)]"
          >
            Всего задач:
            <span
              id="stats-total"
              class="block mt-2 text-2xl font-bold text-[var(--text-color)]"
              >0</span
            >
          </li>
          <li
            class="rounded-xl border border-[var(--border-color)] bg-[#151215] p-4 text-sm text-[var(--muted-color)]"
          >
            Выполнено:
            <span
              id="stats-completed"
              class="block mt-2 text-2xl font-bold text-[var(--text-color)]"
              >0</span
            >
          </li>
          <li
            class="rounded-xl border border-[var(--border-color)] bg-[#151215] p-4 text-sm text-[var(--muted-color)]"
          >
            Осталось:
            <span
              id="stats-active"
              class="block mt-2 text-2xl font-bold text-[var(--text-color)]"
              >0</span
            >
          </li>
        </ul>
      </section>

      <section
        class="rounded-2xl border border-[var(--border-color)] bg-[var(--card-color)] p-5 md:p-6 mb-5 shadow-lg"
      >
        <h2 class="text-lg font-semibold text-[var(--text-color)] mb-5">
          Список задач
        </h2>

        <input
          id="search-input"
          type="search"
          placeholder="Поиск по названию"
          class="mb-4 w-full rounded-xl border border-[var(--border-color)] bg-[#141114] px-4 py-3 text-[var(--text-color)] placeholder:text-[#777078] outline-none transition focus:border-[var(--accent-color)] focus:ring-2 focus:ring-[var(--accent-color)]/20"
        />

        <ul id="task-list" class="space-y-3"></ul>

        <p
          id="empty-message"
          class="py-4 text-center text-[var(--muted-color)]"
          hidden
        >
          Задач пока нет
        </p>

        <button
          id="reset-button"
          type="button"
          class="mt-4 rounded-xl border border-[var(--border-color)] px-4 py-2 text-sm text-[var(--text-color)] transition hover:border-[var(--accent-color)] hover:bg-[var(--primary-color)]"
        >
          Сбросить
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
